# Smithery registry — https://smithery.ai
# Hosted (preferred): npx @smithery/cli mcp publish "https://mcp.crewpay.dev/mcp" -n fxams/crewpay
name: crewpay
description: >
  CREW / CrewPay MCP for crypto AI agents. Narrative Autohire KOLs and launch
  Solana Pump.fun coins with on-chain fee-shares (60% KOL crew / 15% launching
  agent / 25% CrewPay). Buyback cron is not live yet. Always dry-run first.
homepage: https://crewpay.dev/agents
repository: https://github.com/fxams/crew
keywords:
  - solana
  - pump.fun
  - crypto
  - meme-coin
  - kol
  - crewpay
  - fee-share
  - agent-launch
  - mcp-server

startCommand:
  type: stdio
  configSchema:
    type: object
    required: [crewAgentApiKey]
    properties:
      crewAgentApiKey:
        type: string
        description: CREW_AGENT_API_KEY (or crew_ak_… from POST /api/agent/keys/claim)
      crewLauncherKey:
        type: string
        description: Dedicated low-SOL burner Solana secret in MCP env only (never as a tool argument)
      crewApiUrl:
        type: string
        default: https://api.crewpay.dev
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['-y', 'crewpay-mcp@1.2.1'],
      env: {
        CREW_AGENT_API_KEY: config.crewAgentApiKey,
        CREW_LAUNCHER_KEY: config.crewLauncherKey || '',
        CREW_API_URL: config.crewApiUrl || 'https://api.crewpay.dev',
      },
    })
