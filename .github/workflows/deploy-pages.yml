name: Deploy CREW to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/crew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/crew/package-lock.json
      - name: Install, test & build
        env:
          VITE_BASE_PATH: /crew/
          VITE_SITE_URL: https://fxams.github.io/crew
          VITE_PINATA_JWT: ${{ secrets.PINATA_JWT }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
        run: |
          npm ci --legacy-peer-deps
          npm test
          npm run build
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: agent/crew/dist
          force_orphan: true
          enable_jekyll: false
          commit_message: Deploy CREW from ${{ github.sha }}
