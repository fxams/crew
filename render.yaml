# CREW production — https://app.crewpay.dev
# Services: static site + API + Postgres + buyback cron

databases:
  - name: crewpay-db
    plan: basic_256mb
    postgresMajorVersion: "16"
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: crewpay
    runtime: static
    rootDir: agent/crew
    branch: main
    # Keep build lean on Render (tests run in GitHub Actions). A failed `npm test`
    # on the static builder leaves the previous deploy live forever.
    buildCommand: export VITE_BASE_PATH=/ VITE_SITE_URL=https://app.crewpay.dev && npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    renderSubdomainPolicy: disabled
    # Force deploy on every main commit (not checksPass / off).
    autoDeployTrigger: commit
    domains:
      - app.crewpay.dev
      - crewpay.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_SITE_URL
        value: https://app.crewpay.dev
      - key: VITE_CREW_BUYBACK_WALLET
        sync: false
      - key: VITE_CREW_API_URL
        sync: false
      - key: VITE_CREW_API_KEY
        sync: false
      - key: VITE_RPC_URL
        sync: false
      - key: VITE_PINATA_JWT
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: crewpay-api
    runtime: node
    rootDir: agent/crew-api
    branch: main
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crewpay-db
          property: connectionString
      - key: CREW_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://app.crewpay.dev,https://crewpay.dev,https://www.crewpay.dev

  - type: cron
    name: crewpay-buyback
    runtime: node
    rootDir: agent/crew-api
    branch: main
    schedule: "0 * * * *"
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/buyback.js
    plan: starter
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: crewpay-db
          property: connectionString
      - key: CREW_BUYBACK_PRIVATE_KEY
        sync: false
      - key: CREW_BUYBACK_MINT
        sync: false
      - key: CREW_BUYBACK_MAX_SOL
        value: "0.05"
      - key: RPC_URL
        sync: false
