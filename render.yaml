# CREW production — https://app.crewpay.dev
# Services: static site + API + Postgres + buyback cron
#
# IMPORTANT (static site): do NOT set Root Directory in the Render dashboard.
# Publish directory must be `render-site` (repo-root). Blueprint sync often lags —
# if the live site stays on an old bundle, set these manually then Clear cache & deploy.

databases:
  - name: crewpay-db
    plan: basic_256mb
    postgresMajorVersion: "16"
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: crewpay
    runtime: static
    branch: main
    # No rootDir — build + publish paths are repo-root relative (unambiguous).
    # `render-site/` is also committed so a dashboard with a broken build command
    # can still publish by setting Build Command to `true` and Publish Directory
    # to `render-site`.
    buildCommand: |
      set -e
      cd agent/crew
      export VITE_BASE_PATH=/ VITE_SITE_URL=https://app.crewpay.dev
      npm ci --legacy-peer-deps
      npm run build
      cd ../..
      rm -rf render-site
      mkdir -p render-site
      cp -R agent/crew/dist/. render-site/
      date -u +%Y-%m-%dT%H:%M:%SZ > render-site/DEPLOYED_AT.txt
    staticPublishPath: render-site
    pullRequestPreviewsEnabled: false
    renderSubdomainPolicy: disabled
    autoDeployTrigger: commit
    domains:
      - app.crewpay.dev
      - crewpay.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_SITE_URL
        value: https://app.crewpay.dev
      - key: VITE_CREW_BUYBACK_WALLET
        sync: false
      - key: VITE_CREW_API_URL
        sync: false
      - key: VITE_CREW_API_KEY
        sync: false
      - key: VITE_RPC_URL
        sync: false
      - key: VITE_PINATA_JWT
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: crewpay-api
    runtime: node
    rootDir: agent/crew-api
    branch: main
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crewpay-db
          property: connectionString
      - key: CREW_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://app.crewpay.dev,https://crewpay.dev,https://www.crewpay.dev

  - type: cron
    name: crewpay-buyback
    runtime: node
    rootDir: agent/crew-api
    branch: main
    schedule: "0 * * * *"
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/buyback.js
    plan: starter
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: crewpay-db
          property: connectionString
      - key: CREW_BUYBACK_PRIVATE_KEY
        sync: false
      - key: CREW_BUYBACK_MINT
        sync: false
      - key: CREW_BUYBACK_MAX_SOL
        value: "0.05"
      - key: RPC_URL
        sync: false