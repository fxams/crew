# CREW production — https://crewpay.dev (canonical)
# Services: static site + API + Postgres + buyback cron + MCP
# Note: app.crewpay.dev needs a DNS CNAME at the registrar; until then use crewpay.dev.
#
# IMPORTANT (crewpay site): repo root only — do NOT set Root Directory to agent/crew.
# Runtime is Node (scripts/crewpay-static-server.mjs) so /kol/:handle and /ref/:handle
# get dynamic og:image for any handle. Reserved product paths (/kol/tasks, …) stay
# on the SPA shell — they are not treated as X handles. Render cannot convert
# static_site → web in place; if the dashboard still shows static_site, create a
# web service from this blueprint (or scripts/render-crewpay-node-site.mjs) and
# move crewpay.dev to it. Do not run the provision script without approval.

databases:
  - name: crewpay-db
    plan: basic_256mb
    postgresMajorVersion: "16"
    region: oregon
    # Private network only — API/cron use Render internal DATABASE_URL.
    # Do not open 0.0.0.0/0; use temporary allowlist entries for local migrate if needed.
    ipAllowList: []

services:
  - type: web
    name: crewpay
    runtime: node
    branch: main
    plan: starter
    region: oregon
    buildCommand: npm ci --legacy-peer-deps && npm test && npm run build && test -f dist/index.html && node scripts/test-kol-og-server.mjs
    startCommand: node scripts/crewpay-static-server.mjs
    healthCheckPath: /
    pullRequestPreviewsEnabled: false
    renderSubdomainPolicy: disabled
    autoDeployTrigger: commit
    domains:
      - app.crewpay.dev
      - crewpay.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_SITE_URL
        value: https://crewpay.dev
      - key: VITE_CREW_BUYBACK_WALLET
        sync: false
      - key: VITE_CREW_API_URL
        value: https://api.crewpay.dev
      - key: VITE_RPC_URL
        sync: false
      - key: VITE_PINATA_JWT
        sync: false
    headers:
      # Match agent/crew/index.html CSP so WalletConnect / Phantom in-app
      # browsers / Base RPC / x402 keep working. HSTS + clickjacking extras.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https://verify.walletconnect.org https://verify.walletconnect.com https://secure.walletconnect.com https://secure.walletconnect.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    # Static `routes:` do not apply to runtime: node. The Node host injects
    # per-handle OG, skips reserved /kol product words, and SPA-falls back.

  - type: web
    name: crewpay-api
    runtime: node
    rootDir: agent/crew-api
    branch: main
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    # Install + compile services/acp-provider so ACP_INPROCESS=1 can embed the listener.
    buildCommand: npm ci --include=dev --prefix ../../services/acp-provider && npm run build --prefix ../../services/acp-provider && npm ci && npm run build
    startCommand: npm run migrate && npm run start
    healthCheckPath: /api/healthz
    # Custom domain: CNAME api → crewpay-api.onrender.com (Namecheap / DNS)
    # If api.crewpay.dev stays on an old build while MCP/site update, check
    # Render → crewpay-api → Events/Logs and Manual Deploy (Blueprint sync can lag).
    domains:
      - api.crewpay.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crewpay-db
          property: connectionString
      - key: CREW_API_KEY
        sync: false
      - key: CREW_AGENT_API_KEY
        sync: false
      - key: CREW_BUYBACK_WALLET
        sync: false
      - key: RPC_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://app.crewpay.dev,https://crewpay.dev,https://www.crewpay.dev
      - key: SITE_URL
        value: https://crewpay.dev
      - key: X_REDIRECT_URI
        value: https://api.crewpay.dev/api/kols/register/callback
      # X app (OAuth 2.0, PKCE). Callback must match X_REDIRECT_URI. Portal stays closed until both are set.
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      # Refuse sequential create→lock unless CREW_ATOMIC_FALLBACK=1.
      # Jito is retried across mainnet/amsterdam/frankfurt/ny/tokyo with timeouts.
      # Probe: GET /health/jito (also logged at API startup).
      - key: CREW_ATOMIC_REQUIRED
        value: "1"

  - type: web
    name: crewpay-mcp
    runtime: node
    rootDir: agent/crew-mcp
    branch: main
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Custom domain: CNAME mcp → crewpay-mcp.onrender.com
    domains:
      - mcp.crewpay.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CREW_MCP_HTTP
        value: "1"
      - key: CREW_MCP_PUBLIC
        value: "1"
      - key: CREW_API_URL
        value: https://api.crewpay.dev
      # HTTP MCP defaults to publicMode even if this env is missing (code-side).
      # Do not set CREW_AGENT_API_KEY on the public MCP — clients pass x-crew-api-key.
      # Private stdio installs still use CREW_AGENT_API_KEY in local env.
      # To force private HTTP with shared env keys: CREW_MCP_PUBLIC=0.

  - type: cron
    name: crewpay-buyback
    runtime: node
    rootDir: agent/crew-api
    branch: main
    schedule: "0 * * * *"
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/buyback.js
    plan: starter
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: crewpay-db
          property: connectionString
      - key: CREW_BUYBACK_PRIVATE_KEY
        sync: false
      - key: CREW_BUYBACK_MINT
        sync: false
      - key: CREW_BUYBACK_MAX_SOL
        value: "0.05"
      - key: CREW_BUYBACK_DRY_RUN
        value: "0"
      - key: CREW_BUYBACK_SLIPPAGE_BPS
        value: "100"
      - key: RPC_URL
        sync: false