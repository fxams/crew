# CREW production — https://app.crewpay.dev
# Services: static site + API + Postgres + buyback cron
#
# IMPORTANT (static site): do NOT set Root Directory in the Render dashboard.
# Publish directory must be `render-site` (repo-root). Blueprint sync often lags —
# if the live site stays on an old bundle, set these manually then Clear cache & deploy.

databases:
  - name: crewpay-db
    plan: basic_256mb
    postgresMajorVersion: "16"
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

services:
  - type: web
    name: crewpay
    runtime: static
    branch: main
    # No rootDir. Build + publish are repo-root relative.
    # Output is copied to both dist/ and render-site/ so either dashboard
    # publish directory picks up the same build (home has no launch form).
    buildCommand: npm ci --legacy-peer-deps && npm test && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    renderSubdomainPolicy: disabled
    autoDeployTrigger: commit
    domains:
      - app.crewpay.dev
      - crewpay.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_SITE_URL
        value: https://app.crewpay.dev
      - key: VITE_CREW_BUYBACK_WALLET
        sync: false
      - key: VITE_CREW_API_URL
        sync: false
      - key: VITE_CREW_API_KEY
        sync: false
      - key: VITE_RPC_URL
        sync: false
      - key: VITE_PINATA_JWT
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: crewpay-api
    runtime: node
    rootDir: agent/crew-api
    branch: main
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run start
    healthCheckPath: /api/healthz
    # Custom domain: CNAME api → crewpay-api.onrender.com (Namecheap / DNS)
    domains:
      - api.crewpay.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crewpay-db
          property: connectionString
      - key: CREW_API_KEY
        sync: false
      - key: CREW_AGENT_API_KEY
        sync: false
      - key: CREW_BUYBACK_WALLET
        sync: false
      - key: RPC_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://app.crewpay.dev,https://crewpay.dev,https://www.crewpay.dev

  - type: web
    name: crewpay-mcp
    runtime: node
    rootDir: agent/crew-mcp
    branch: main
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Custom domain: CNAME mcp → crewpay-mcp.onrender.com
    domains:
      - mcp.crewpay.dev
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CREW_MCP_HTTP
        value: "1"
      - key: CREW_API_URL
        value: https://api.crewpay.dev
      - key: CREW_AGENT_API_KEY
        sync: false

  - type: cron
    name: crewpay-buyback
    runtime: node
    rootDir: agent/crew-api
    branch: main
    schedule: "0 * * * *"
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/buyback.js
    plan: starter
    region: oregon
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: crewpay-db
          property: connectionString
      - key: CREW_BUYBACK_PRIVATE_KEY
        sync: false
      - key: CREW_BUYBACK_MINT
        sync: false
      - key: CREW_BUYBACK_MAX_SOL
        value: "0.05"
      - key: CREW_BUYBACK_DRY_RUN
        value: "0"
      - key: CREW_BUYBACK_SLIPPAGE_BPS
        value: "100"
      - key: RPC_URL
        sync: false