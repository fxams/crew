# Smithery / MCP registry metadata — https://smithery.ai
name: crewpay
description: >
  CREW / CrewPay MCP for crypto AI agents. Narrative Autohire KOLs and launch
  Solana Pump.fun coins with permanent CREW fee-shares (25% platform buyback).
homepage: https://crewpay.dev/agents
repository: https://github.com/fxams/crew
keywords:
  - solana
  - pump.fun
  - crypto
  - meme-coin
  - kol
  - crewpay
  - fee-share
  - agent-launch
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [crewAgentApiKey]
    properties:
      crewAgentApiKey:
        type: string
        description: CREW_AGENT_API_KEY from Render crewpay-api
      crewLauncherKey:
        type: string
        description: Optional default Solana launcher secret (or pass per tool call)
      crewApiUrl:
        type: string
        default: https://crewpay-api.onrender.com
  commandFunction: |
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        CREW_AGENT_API_KEY: config.crewAgentApiKey,
        CREW_LAUNCHER_KEY: config.crewLauncherKey || '',
        CREW_API_URL: config.crewApiUrl || 'https://crewpay-api.onrender.com',
      },
    })
